<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#050508"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <title>Kitchen Display — RestroGo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="stylesheet" href="assets/css/base.css"/>
  <link rel="stylesheet" href="assets/css/kitchen.css"/>
</head>
<body class="kitchen-body">

<!-- ── KITCHEN NAV ── -->
<header class="kitchen-header" id="kitchenHeader">
  <div class="kh-left">
    <span id="kitchenLogoIcon">🍳</span>
    <div>
      <div class="kh-restaurant" id="kitchenRestaurantName">Kitchen Display</div>
      <div class="kh-sub">Live Order Stream</div>
    </div>
  </div>
  <div class="kh-center">
    <div class="kh-live"><span class="pulse-dot"></span> LIVE</div>
    <div class="kh-time" id="kitchenClock">--:--:--</div>
    <div class="kh-date" id="kitchenDate"></div>
  </div>
  <div class="kh-right">
    <button class="kh-btn" id="soundToggle" title="Toggle sound notifications" onclick="KitchenApp.toggleSound()">🔔 Sound ON</button>
    <button class="kh-btn" id="fullscreenBtn" title="Toggle fullscreen" onclick="KitchenApp.toggleFullscreen()">⛶ Fullscreen</button>
  </div>
</header>

<!-- ── STATS BAR ── -->
<div class="kitchen-stats-bar">
  <div class="ks-item">
    <span class="ks-val" id="kStatNew">0</span>
    <span class="ks-lbl">New</span>
  </div>
  <div class="ks-item">
    <span class="ks-val" id="kStatPreparing">0</span>
    <span class="ks-lbl">Preparing</span>
  </div>
  <div class="ks-item">
    <span class="ks-val" id="kStatReady">0</span>
    <span class="ks-lbl">Ready</span>
  </div>
  <div class="ks-item">
    <span class="ks-val" id="kStatCompleted">0</span>
    <span class="ks-lbl">Completed Today</span>
  </div>
</div>

<!-- ── KANBAN BOARD ── -->
<main class="kitchen-board" id="kitchenBoard">

  <!-- NEW ORDERS -->
  <div class="k-column" id="col-new">
    <div class="k-col-header new">
      <span class="k-col-title">🆕 New Orders</span>
      <span class="k-col-count" id="count-new">0</span>
    </div>
    <div class="k-tickets" id="tickets-new">
      <div class="k-empty">Waiting for orders...</div>
    </div>
  </div>

  <!-- PREPARING -->
  <div class="k-column" id="col-preparing">
    <div class="k-col-header preparing">
      <span class="k-col-title">🔥 Preparing</span>
      <span class="k-col-count" id="count-preparing">0</span>
    </div>
    <div class="k-tickets" id="tickets-preparing">
      <div class="k-empty">No orders preparing</div>
    </div>
  </div>

  <!-- READY -->
  <div class="k-column" id="col-ready">
    <div class="k-col-header ready">
      <span class="k-col-title">✅ Ready to Serve</span>
      <span class="k-col-count" id="count-ready">0</span>
    </div>
    <div class="k-tickets" id="tickets-ready">
      <div class="k-empty">No orders ready</div>
    </div>
  </div>

  <!-- COMPLETED -->
  <div class="k-column" id="col-completed">
    <div class="k-col-header completed">
      <span class="k-col-title">🏁 Completed</span>
      <span class="k-col-count" id="count-completed">0</span>
    </div>
    <div class="k-tickets" id="tickets-completed">
      <div class="k-empty">No completed orders yet</div>
    </div>
  </div>

</main>

<!-- ── DEMO ORDERS INJECTOR (for demo mode only) ── -->
<div class="kitchen-demo-bar" id="kitchenDemoBar" style="display:none">
  <span>Demo Mode — </span>
  <button class="kh-btn" onclick="KitchenApp.injectDemoOrder()">+ Simulate New Order</button>
  <a href="menu.html?demo=restaurant" class="kh-btn">Open Menu →</a>
</div>
